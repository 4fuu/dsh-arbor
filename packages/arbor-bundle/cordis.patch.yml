# The dsh-arbor bundle patch: arbor as DSH's agent driver.
#
# A bundle patch is the layer a profile composes, applied above the bundle
# layers it lists. This one does four things:
#
#   1. Disables the base `agent` row. DSH allows exactly one AgentFactory per
#      process — `AgentRegistry.setFactory` throws on a second registration and
#      AgentLoop claims that slot in its own init — and `applyPatches` treats a
#      patch's `name` as a check only, so a row is replaced, never re-pointed.
#   2. Inserts the routing registry (`@4fu/dsh-arbor-driver`) in its place. It
#      captures the embedded AgentLoop's self-registration and routes per
#      session: `meta.agentPreset === 'arbor'` goes to arbor, every other
#      session keeps running on the official loop. The `agent-loop` row itself
#      is untouched.
#   3. Inserts the one Arbor host (`@4fu/dsh-arbor-host`) with its durable
#      SQLite journal and note store under `DSH_HOME/arbor/`, and the driver
#      (`@4fu/dsh-arbor-driver/driver`) that runs arbor-preset sessions on it.
#   4. Inserts the arbor preset (`@4fu/dsh-arbor-preset`), which is what puts
#      arbor in the preset roster a user picks from. On a profile with no preset
#      registry the row simply never activates, and a session still selects
#      arbor through `meta.agentPreset`.
#   5. Inserts `@4fu/dsh-arbor-ui`, which shadows DSH's client
#      `ui-permission` composer seat: it reads the seat permission-presets
#      registers (arbor-ui depends on it, so it is registered first) and
#      re-registers that one `single` slot at a lower priority, rendering the
#      real control for an ordinary session and nothing for an arbor one, whose
#      tools run on the host with no sandbox. permission-presets itself is left
#      enabled — its `/permission` popup and settings row are kept for both — so
#      only the composer chip is gated. On a profile with no browser (headless,
#      acp, sdk) the inserted package declares no host behavior and does not
#      activate.
#   6. Inserts `@4fu/dsh-arbor-facts`, which reads what arbor is doing in a
#      session — the window chain, the board, the workspace, the active notes,
#      `/env`, schedules and settings — through the arbor host's own API and
#      serves it to the browser on DSH's exact Fetch registry,
#      `/api/arbor/facts` (an NDJSON stream) and `/api/arbor/search`. The route
#      exists only where `connection` is mounted (the web profile); on a
#      headless profile the row registers no route and changes nothing.
#   7. Inserts `@4fu/dsh-arbor-ui-workspace`, a `dsh.client` package that filters
#      DSH's hero project picker: an ordinary session lists nothing from arbor's
#      shared folder, an arbor session lists those projects plus the directories
#      the user added outside them, marked external. The seat
#      (`conversation.hero.workspace`) declares a child slot and cannot be
#      shadowed, and neither the client nor the server offers a per-session view
#      of the workspace list, so the package wraps `ctx.slots.register` — one
#      service instance shared by every plugin — for as long as it is live: the
#      shipped plugin's deferred registration of that seat arrives through the
#      wrapper, keeps its options, children table, inject face and locale, and
#      only its component is replaced by the filtered one. The shipped row stays
#      enabled; disabling it was tried and does not work, because the host serves
#      the client module graph from the composed plugin tree, so a disabled row's
#      package is not in the graph and a `dsh.client.inject` dependency of it
#      cannot arrive. The registration shape is pinned by proof 18, since this
#      row is what makes the wrapper responsible for it.
#
#      The wrapper keeps each caller's own context. A registration's disposer
#      is an effect on the context it was made through, and `ctx.slots` is a
#      traceable proxy that binds that context per caller: forwarding through a
#      pre-bound `register` would put every registration made while this plugin
#      is live — DSH's sidebar, its panel list, the workspace browser — on this
#      plugin's fiber, and disabling the bundle would then tear down DSH's own
#      seats. The wrapped seats also read their filter from a page-wide store,
#      so a disposed package leaves the shipped picker and sidebar exactly as
#      they were, and a later enable filters them again without a reload.
#
#      What a live change can and cannot do: disabling and uninstalling restore
#      every client seat. Enabling re-applies the client half, but DSH's host
#      loader cannot provide the `agents` service again while the base row's
#      registry is still registered, so the arbor host rows wait and the Arbor
#      page tells the user to restart DSH. A version update disposes the old
#      package first; the client repair in `@4fu/dsh-arbor-ui` reloads the page
#      once when that old dispose removed DSH's sidebar (2026.1110.1 did).
#
# Row order carries no load semantics: activation is service-availability
# driven, so the insert position does not matter.

- id: agent
  disabled: true

- insert:
    - id: arbor-agent
      name: '@4fu/dsh-arbor-driver'

    - id: arbor-host
      name: '@4fu/dsh-arbor-host'

    - id: arbor-driver
      name: '@4fu/dsh-arbor-driver/driver'

    - id: arbor-facts
      name: '@4fu/dsh-arbor-facts'

    - id: arbor-preset
      name: '@4fu/dsh-arbor-preset'

    - id: arbor-ui
      name: '@4fu/dsh-arbor-ui'

    - id: arbor-ui-workspace
      name: '@4fu/dsh-arbor-ui-workspace'
