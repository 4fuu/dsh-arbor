name: CI

on:
  push:
    branches: [main, 'b*']
  pull_request:

jobs:
  # The whole suite runs against the scripted model, so it needs no key, no
  # network and no flake from a real provider.
  check-and-proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # DSH is pinned to dsh-v0.2.2-rc.1 (docs/versions.md). Fail before the
      # suite if a manifest or the prompt table has drifted.
      - name: Check the DSH pin
        run: pnpm check:pin
      - name: Check
        run: pnpm check
      - name: Proofs
        run: pnpm proofs

  # What a user actually installs: the packed tarballs into a fresh DSH web
  # profile, then both kinds of session through the RPC the web UI uses. The
  # checkout resolves one copy of every DSH package, so only this job can see a
  # published package that adds a second copy to a profile.
  profile-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Profile install
        run: pnpm check:profile

  # The web client is recomposed in place when a plugin is switched: a client
  # package whose dispose does not release the seats it occupies or shadows
  # takes DSH's own sidebar with it, and a fresh page load never shows it. This
  # job drives the real page in headless Chrome: switch the bundle off and on,
  # and assert the sidebar, the session tree and the current page still render.
  live-ui:
    runs-on: ubuntu-latest
    env:
      ARBOR_CHECK_LIVE_WORK: ${{ runner.temp }}/dsh-arbor-live
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Live unload check
        run: pnpm check:live
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-ui-screenshots
          path: ${{ runner.temp }}/dsh-arbor-live/screenshots
          if-no-files-found: ignore

  # Four proofs against the real DeepSeek model, including the B3 closed loop.
  # The job is skipped
  # unless the repository variable ARBOR_PROOF_LIVE is set to 1, because a run
  # without a key fails on the provider's model listing. Set the variable and a
  # DEEPSEEK_API_KEY secret on the repository to enable it.
  live-model:
    if: ${{ vars.ARBOR_PROOF_LIVE == '1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Live proofs
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ARBOR_PROOF_LIVE: '1'
        run: |
          pnpm proof:boot
          pnpm proof:routing
          pnpm proof:roundtrip
          pnpm proof:loop
