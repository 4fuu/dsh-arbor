name: CI

on:
  push:
    branches: [main, b1, b2, b3]
  pull_request:

jobs:
  # The whole suite runs against the scripted model, so it needs no key, no
  # network and no flake from a real provider.
  check-and-proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check
        run: pnpm check
      - name: Proofs
        run: pnpm proofs

  # Four proofs against the real DeepSeek model, including the B3 closed loop.
  # The job is skipped
  # unless the repository variable ARBOR_PROOF_LIVE is set to 1, because a run
  # without a key fails on the provider's model listing. Set the variable and a
  # DEEPSEEK_API_KEY secret on the repository to enable it.
  live-model:
    if: ${{ vars.ARBOR_PROOF_LIVE == '1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Live proofs
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ARBOR_PROOF_LIVE: '1'
        run: |
          pnpm proof:boot
          pnpm proof:routing
          pnpm proof:roundtrip
          pnpm proof:loop
