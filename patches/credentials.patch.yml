# The credential-store overlay for proof 26: the one row the settings page's key
# entry needs.
#
# The headless profile disables `@deepseek-ai/dsh-credentials-local` because a
# one-shot job authenticates from its launch environment instead of a store. The
# web and desktop profiles mount it, and it is DSH's own writable credential
# source there: the document at `$DSH_HOME/.credentials.yaml`, which the Models
# page writes and arbor's settings page writes. Re-enabling the row is what
# makes the proof exercise the same seam a user's web profile has, rather than
# a hand-built stub.

- id: credentials
  disabled: false
