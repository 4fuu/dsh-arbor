# The read-only sandbox overlay for proof 11.
#
# Two things, and they are separate on purpose:
#
#   1. `sandboxPrompt: true` on the arbor-host row — B3's flag. Until B3 mounts
#      a workspace whose file and bash calls really run through DSH's sandbox,
#      the <harness> section writes no sandbox line, because the line would
#      promise enforcement that does not exist. Proof 11 renders case 4 twice:
#      once with the flag off (the line is absent, which is case 1) and once
#      with it on, which is what the owner reviews.
#   2. the sandbox mode itself, read-only. The mode is the session's own, from
#      the `sandbox/mode` fold the sandbox-policy row owns; this overlay sets
#      the deployment default the arbor overlay already replaced.

- id: sandbox-policy
  inject: []
  config:
    mode: read-only
    workspaceRoot: !!js process.cwd()

- id: arbor-host
  config:
    sandboxPrompt: true
