# The read-only sandbox overlay for proof 11.
#
# One thing: the sandbox mode itself, read-only. The mode is the session's own,
# from the `sandbox/mode` fold the sandbox-policy row owns; this overlay
# replaces the deployment default the arbor overlay already set.
#
# Nothing else is needed to make the <harness> section write its sandbox line.
# The line's condition is `ctx.arborHost.fileToolsSandboxed` — the capability
# fact the host reads off the mounted filesystem and shell backends
# (`ctx.fs.sandboxMode` / `ctx.shell.sandboxMode`, docs/install-for-agents.md
# section 8) — and the `headless` profile this proof boots mounts
# `@deepseek-ai/dsh-fs-sandbox` as `ctx.fs`, so it is already true. A
# deployment that mounts no confining backend writes no sandbox line, because
# the line would promise enforcement that does not exist.
#
# So the default case (case 1) renders the `workspace-write` line and this
# overlay renders the `read-only` one: the same line, a different mode, which
# is exactly what the owner is asked to review.

- id: sandbox-policy
  inject: []
  config:
    mode: read-only
    workspaceRoot: !!js process.cwd()
