# The arbor test overlay: the bundle patch plus the rows a proof needs.
#
# The bundle patch (`@4fu/dsh-arbor-bundle/cordis.patch.yml`) is what an
# installed deployment composes, and the proofs load it directly as the first
# overlay. This layer adds only what a proof needs and a deployment does not:
#
#   1. The one-shot headless runner rows are disabled, because proofs create
#      and drive their own agents, exactly like runFixtureTurn does.
#   2. The headless bundle's sandbox-policy config reads the now-disabled
#      headlessStartup provider, so its whole config is replaced and the inject
#      dropped.
#
# Everything else — the routing registry, the arbor host, the driver and the
# preset — comes from the bundle patch itself.

- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: sandbox-policy
  inject: []
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()
