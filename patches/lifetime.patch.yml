# The window-lifetime overlay for proof 9: arbor's own idle policy, with the
# period shortened so a proof does not wait five minutes for it. The shipped
# settings set no idle period at all — arbor's 300 s default applies — and this
# overlay changes only the number, not the policy.

- id: arbor-host
  config:
    settings:
      window:
        idleSeconds: 1
